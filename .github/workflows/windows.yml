name: Windows desktop build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged desktop application
        shell: pwsh
        run: |
          $env:LUMA_TEST_EXE = (Resolve-Path 'release/win-unpacked/Luma.exe').Path
          npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Luma-Windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-test-results
          path: test-results/
